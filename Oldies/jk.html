<!DOCTYPE html>
<html>
<title>nunu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
    box-sizing: border-box;
}
body
height:100%;
font-family:Arial;
margin:0;
background-color:pink;
}

.tab {
    float: left;
    border: 1px solid #ccc;
    background-color: #f1f1f1;
    width: 30%;
    height: 300px;
}

.tab button {
    display: block;
    background-color: inherit;
    color: black;
    padding: 22px 16px;
    width: 100%;
    border: none;
    outline: none;
    text-align: left;
    cursor: pointer;
    transition: 0.3s;
    font-size: 17px;
}

.tab button:hover {
    background-color: #ddd;
}

.tab button.active {
    background-color: #ccc;
}


.tablink{
background-color:orange;
color:black;
padding:14px 16px;
font-size:17px;
float:left;
cursor:pointer;
border:none;
display:inline-block;
width:25%;
}
.tabcontent{
display:none;
color:black;
padding:100px 20px;
height:100%;
}
.header{
      color: gold;
      text-align: center;
      text-shadow: 2px 2px 3px black;
      font-weight: bolder;
      font-size: 30px;
      font-style: none;
      font-family: tahoma;
      background-color: crimson;
      height: 175px;
      width: 100%;
    }
    .header h3{
      color:lightblue;
    }
    #helpdiv{
      color: green;
      text-align: center;
      text-shadow: 2px 2px 3px black;
      font-weight: bolder;
      font-size: 45px;
      font-style: none;
      font-family: tahoma;
      }
    #helpdiv button{
      border-radius: 2px;
      padding: 50px 100px;
      font-size: 60px;
    }
</div>
</style>
<body>
        <div class="mark">
    <marquee>Welcome to Our Website</marquee>
  </div>
<div class="header">
  <h1>Environment</h1>
  <h3>The Creation Of Nature</h3></div>
<div style="display:none;" id="mySidebar">
  <button class="op" onclick="w3_close()">Close &times;</button>
  <div class="tab">
<button class="tablink" onclick="openPage('Home')" id="defaultOpen">Home</button>
<button class="tablink" onclick="openPage('About')">About</button>
<button class="tablink" onclick="openPage('Gallery')">Gallery</button>
<button class="tablink" onclick="openPage('Contact')">Contact</button>
<div></div>
  </div>
</div>
<div id="main">
<div class="o">
  <button id="openNav" class="i" onclick="w3_open()">&#9776;</button>
  <div class="w3-container">
  </div>
</div>
.<div id="helpdiv" style="display:block">
  <h1>Welcome To Our Website</h1>
  <h2>Click The Button given Below First:</h2>
  <button onclick="jk()">Click Me</button>
</div>
<div id="Home" class="tabcontent">
	home
</div>
<div id="About" class="tabcontent">
	about
</div>
<div id="Gallery" class="tabcontent">
	gallery
</div>
<div id="Contact" class="tabcontent">
	contact
<div>
</div>
<script>
  function openPage(pagename){
    var i;
    var tabcontent=document.getElementsByClassName("tabcontent");
    for(i=0;i<tabcontent.length;i++){
      tabcontent[i].style.display="none";
    }
    document.getElementById(pagename).style.display="block";
  }
function w3_open() {
  document.getElementById("main").style.marginLeft = "25%";
  document.getElementById("mySidebar").style.width = "25%";
  document.getElementById("mySidebar").style.display = "block";
  document.getElementById("openNav").style.display = 'none';
}
function w3_close() {
  document.getElementById("main").style.marginLeft = "0%";
  document.getElementById("mySidebar").style.display = "none";
  document.getElementById("openNav").style.display = "inline-block";
}
function jk(){
  alert("Click The Menu Button At left side Of Your Screen");
}
// close the div in 5 secs
window.setTimeout("closeHelpDiv();", 8000);

function closeHelpDiv(){
document.getElementById("helpdiv").style.display=" none";
}
</script>

</body>
</html>
