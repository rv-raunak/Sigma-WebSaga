<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav Bar Again</title>
    <style>
        :root
        {
            --mainColor: rgb(254, 240, 255);
            --secColor: rgb(196, 197, 255);
            --textColor: black;
            --half: 50vw;
        }
        *{
            margin: 0;
            padding: 0;
        }

        body{
            background-color: var(--secColor);
        }
        nav{
            
        }

        nav ul{
            display:flex;
            list-style: none;
            background-color: var(--mainColor);
            position: relative;
            box-sizing: border-box;
            padding-left: 500px;
        }
        nav ul li{
            padding: 20px 45px;
            border-right: 1px solid var(--secColor);
            color: var(--textColor);
            margin: 0px 0px;
            font-size: large;
            

        }

        nav ul li:first-child{
            border-left: 1px solid var(--secColor);
        }

    </style>
</head> 
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>More</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
